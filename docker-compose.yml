version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zentimer
      POSTGRES_PASSWORD: zentimer123
      POSTGRES_DB: zentimer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentimer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zen-timer-api:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://zentimer:zentimer123@db:5432/zentimer
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-not-for-production}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8000","http://localhost"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    ports:
      - "80:80"
    depends_on:
      - zen-timer-api
    restart: unless-stopped

volumes:
  postgres_data:
