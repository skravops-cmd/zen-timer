<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Timer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="supplemental.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>Zen Timer</header>

  <main>
    <!-- Timer Section -->
    <section class="hero">
      <div class="card timer-card">
        <svg class="progress-ring" viewBox="0 0 200 200" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
          <circle class="progress-ring__background" cx="100" cy="100" r="90" />
          <circle class="progress-ring__circle" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="0" />
        </svg>

        <div class="timer-display">
          <div class="timer-time">25:00</div>
          <div class="timer-mode">Focus</div>
        </div>

        <div class="mode-buttons">
          <button class="mode-btn active" data-mode="focus">Focus</button>
          <button class="mode-btn" data-mode="shortBreak">Short Break</button>
          <button class="mode-btn" data-mode="longBreak">Long Break</button>
        </div>

        <div class="timer-controls">
          <button class="btn btn-primary" id="startPauseBtn" aria-label="Start or pause timer">Start</button>
          <button class="btn" id="resetBtn" aria-label="Reset timer">Reset</button>
          <button class="btn" id="settingsBtn" aria-label="Open settings">Settings</button>
        </div>
      </div>
    </section>

    <!-- Task Section -->
    <section class="task-section">
      <div class="card">
        <h3>Tasks</h3>
        <input type="text" class="task-input" placeholder="Add a task..." id="taskInput" aria-label="Add new task">
        <ul class="task-list" id="taskList"></ul>
      </div>
    </section>
  </main>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content card">
      <h3>Settings</h3>
      <div class="options">
        <div>
          <label>Focus Duration (min)</label>
          <input type="range" id="focusDuration" min="1" max="60" step="1">
          <span id="focusDurationVal">25</span>
        </div>
        <div>
          <label>Short Break (min)</label>
          <input type="range" id="shortBreakDuration" min="1" max="30" step="1">
          <span id="shortBreakVal">5</span>
        </div>
        <div>
          <label>Long Break (min)</label>
          <input type="range" id="longBreakDuration" min="1" max="60" step="1">
          <span id="longBreakVal">15</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="autoStartBreaks"> Auto-start breaks
        </label>
        <label class="toggle">
          <input type="checkbox" id="autoStartPomodoros"> Auto-start pomodoros
        </label>
        <label class="toggle">
          <input type="checkbox" id="soundToggle" checked> Sound
        </label>
        <label class="toggle">
          <input type="checkbox" id="themeToggle"> Light Theme
        </label>
      </div>
      <button class="btn btn-primary" id="closeSettingsBtn">Close</button>
    </div>
  </div>

  <footer>
    <p>Zen Timer - Minimal Pomodoro Timer</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
